<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fedify browser lab</title>
    <link rel="stylesheet" href="/static/index.css">
  </head>
  <body>
    <h1>Fedify browser lab</h1>
    <p class="muted">Browser → Express → Fedify, using one HTTP origin.</p>

    <section>
      <h2>Connection</h2>
      <p id="origin">Checking…</p>
      <div class="row">
        <button data-action="health">Health</button>
        <button data-action="config">Configuration</button>
        <button data-action="followers">Followers</button>
      </div>
    </section>

    <div class="grid">
      <section>
        <h2>ActivityPub discovery</h2>
        <div class="row">
          <select id="actor"></select>
          <button data-action="webfinger">WebFinger</button>
          <button data-action="actor">Actor JSON</button>
        </div>
      </section>

      <section>
        <h2>Outgoing activity</h2>
        <p class="muted">Construct and send a Create to the selected actor’s
          followers.</p>
        <button data-action="announce">Announce static object</button>
      </section>
    </div>

    <section style="margin-top: 14px">
      <h2>Persisted posts</h2>
      <textarea id="post-content"
        placeholder="Any text, including Unicode and line breaks"></textarea>
      <div class="row" style="margin-top: 8px">
        <input id="post-token" type="password"
          placeholder="LAB_POST_TOKEN, if configured">
        <label><input id="post-publish" type="checkbox"> Publish to followers
          now</label>
        <button data-action="create-post">Create post</button>
        <button data-action="posts">List posts</button>
      </div>
    </section>

    <h2 class="response-title">Response</h2>
    <pre id="output">Ready.</pre>

    <script src="/static/index.js"></script>
  </body>
</html>
