<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostmaxxing moderation</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101114;
      color: #f2f3f5;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #101114;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      margin: 0;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    select,
    button {
      min-height: 36px;
      border: 1px solid #3a3e47;
      border-radius: 6px;
      background: #191b20;
      color: #f2f3f5;
      padding: 0 12px;
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }
    #status {
      color: #aeb4c0;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    article {
      border: 1px solid #30343c;
      border-radius: 8px;
      background: #17191f;
      overflow: hidden;
    }
    video,
    img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #07080a;
    }
    .body {
      padding: 12px;
    }
    .meta {
      color: #aeb4c0;
      font-size: 13px;
      line-height: 1.45;
      margin: 8px 0 12px;
      word-break: break-word;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .approve {
      border-color: #2f7d46;
      background: #174927;
    }
    .reject {
      border-color: #8b3434;
      background: #4f1d1d;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ghostmaxxing moderation</h1>
    <div class="toolbar">
      <select id="kind">
        <option value="">All pending</option>
        <option value="video">Video</option>
        <option value="clipboard">Clipboard</option>
      </select>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>
  <div id="status">Loading pending uploads...</div>
  <main id="items" class="grid" aria-live="polite"></main>

  <script>
    const itemsEl = document.getElementById('items');
    const statusEl = document.getElementById('status');
    const kindEl = document.getElementById('kind');
    const refreshEl = document.getElementById('refresh');

    function setBusy(isBusy) {
      refreshEl.disabled = isBusy;
      kindEl.disabled = isBusy;
    }

    function text(value, fallback = 'None') {
      return value || fallback;
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.message || `Request failed with ${response.status}`);
      }
      return body;
    }

    async function moderate(id, action) {
      setBusy(true);
      try {
        const body = await requestJson(`/api/admin/${action}/${id}`, { method: 'POST' });
        statusEl.textContent = body.publicUrl ? `${action} complete: ${body.publicUrl}` : `${action} complete.`;
        await loadPending();
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        setBusy(false);
      }
    }

    function renderItem(item) {
      const article = document.createElement('article');
      const media = item.kind === 'clipboard' ? document.createElement('img') : document.createElement('video');
      media.src = item.mediaUrl;
      if (item.kind === 'video') {
        media.controls = true;
        media.preload = 'metadata';
      } else {
        media.alt = `Clipboard upload ${item.id}`;
      }

      const body = document.createElement('div');
      body.className = 'body';
      const title = document.createElement('strong');
      title.textContent = `${item.kind} ${item.id}`;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = [
        `Consent: ${item.consentVersion}`,
        `Ghostyle: ${text(item.ghostyleId)}`,
        `App: ${text(item.appVersion)}`,
        `Created: ${item.createdAt}`,
        `Note: ${text(item.userNote)}`
      ].join(' | ');

      const actions = document.createElement('div');
      actions.className = 'actions';

      const approve = document.createElement('button');
      approve.className = 'approve';
      approve.type = 'button';
      approve.textContent = 'Approve';
      approve.addEventListener('click', () => moderate(item.id, 'approve'));

      const reject = document.createElement('button');
      reject.className = 'reject';
      reject.type = 'button';
      reject.textContent = 'Reject';
      reject.addEventListener('click', () => moderate(item.id, 'reject'));

      actions.append(approve, reject);
      body.append(title, meta, actions);
      article.append(media, body);
      return article;
    }

    async function loadPending() {
      setBusy(true);
      itemsEl.replaceChildren();
      const query = kindEl.value ? `?kind=${encodeURIComponent(kindEl.value)}` : '';
      try {
        const body = await requestJson(`/api/admin/pending${query}`);
        if (body.pending.length === 0) {
          statusEl.textContent = 'No pending uploads.';
          return;
        }
        statusEl.textContent = `${body.pending.length} pending upload${body.pending.length === 1 ? '' : 's'}.`;
        itemsEl.append(...body.pending.map(renderItem));
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        setBusy(false);
      }
    }

    refreshEl.addEventListener('click', loadPending);
    kindEl.addEventListener('change', loadPending);
    loadPending();
  </script>
</body>
</html>
