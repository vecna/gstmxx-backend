# Configurazione per ghostyles.vecna.eu
server {
    listen 80;
    listen [::]:80;
    server_name ghostyles.vecna.eu;

    # Certificati SSL (gestiti via Certbot / Let's Encrypt)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/ghostyles.vecna.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghostyles.vecna.eu/privkey.pem;

    # Limitazione preventiva sulla dimensione massima dei video caricati
    client_max_body_size 15M;

    # Root del progetto frontend (se Nginx deve servire anche il laboratorio)
    root /var/www/ghostmaxxing;
    index index.html;

    # Rotta 1: Ottimizzazione per i video approvati pubblici
    location /videos/ {
        alias /var/www/ghostmaxxing/backend/storage/approved/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Rotta 2: Ottimizzazione per i thumbnail/poster dei video
    location /thumbnails/ {
        alias /var/www/ghostmaxxing/backend/storage/thumbnails/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Rotta 3: Proxy inverso verso il backend Node.js (API e Admin)
    location / {
        proxy_pass http://127.0.0.1:3000; # Porta del server Express
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generosi per le pipeline di elaborazione ffmpeg
        proxy_read_timeout 90s;
    }
}