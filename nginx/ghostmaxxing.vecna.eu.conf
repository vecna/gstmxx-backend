# Configuration for ghostmaxxing.vecna.eu
server {
    listen 80;
    listen [::]:80;
    server_name ghostmaxxing.vecna.eu;

    # TLS certificates managed by Certbot / Let's Encrypt.
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/ghostmaxxing.vecna.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghostmaxxing.vecna.eu/privkey.pem;

    # Keep this in sync with the Express/multer upload limit.
    client_max_body_size 15M;

    root /var/www/ghostmaxxing;
    index index.html;

    location /videos/ {
        alias /var/www/ghostmaxxing/backend/storage/approved/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /clipboard/ {
        alias /var/www/ghostmaxxing/backend/storage/approved/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /thumbnails/ {
        alias /var/www/ghostmaxxing/backend/storage/thumbnails/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
