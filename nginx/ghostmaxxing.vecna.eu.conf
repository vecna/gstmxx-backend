# nginx site config for ghostmaxxing.vecna.eu
#
# Layout of the unified deployment:
#   * static client  -> served directly from the client-interface root
#   * approved media -> aliased from storage/ (cached, never hits Node)
#   * backend routes -> proxied to the Node process on 127.0.0.1:4040
#   * hot GETs of /posts/ and /federation/actors/ -> micro-cached, so a
#     fediverse crowd hitting a viral post does not fall through to Node
#
# NOTE: `proxy_cache_path` and `map` are http{} directives. Put the two blocks
# below in the main http context (nginx.conf or a conf.d/ snippet), not inside
# this server{}. They are shown here for reference.
#
#   proxy_cache_path /var/cache/nginx/gstmxx levels=1:2
#                    keys_zone=posts:16m max_size=2g inactive=30d;
#
#   # Collapse Accept down to two variants so the cache is not fragmented by
#   # every browser's long Accept header, while still separating the HTML
#   # preview from the ActivityPub representation of the same /posts/:id URL.
#   map $http_accept $gstmxx_variant {
#       default            html;
#       "~*activity\+json" activitypub;
#       "~*ld\+json"       activitypub;
#   }

server {
    listen 80;
    listen [::]:80;
    server_name ghostmaxxing.vecna.eu;

    # TLS via Certbot / Let's Encrypt.
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/ghostmaxxing.vecna.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghostmaxxing.vecna.eu/privkey.pem;

    # Keep in sync with the Express/multer upload limit (15 MB).
    client_max_body_size 15M;

    # The static client is copied here by `npm run install` in the client repo.
    root /var/www/ghostmaxxing/client-interface;
    index index.html;

    # --- Approved media: served from disk, cached, never proxied ------------
    location /videos/ {
        alias /var/www/ghostmaxxing/backend/storage/approved/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
    location /clipboard/ {
        alias /var/www/ghostmaxxing/backend/storage/approved/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
    location /thumbnails/ {
        alias /var/www/ghostmaxxing/backend/storage/thumbnails/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- Hot, cacheable backend GETs ----------------------------------------
    # Posts and actor documents are read far more than they change. Serve them
    # from cache; each hit renews the entry's life (inactive=30d in the zone),
    # so the most-requested content stays warm on its own and rarely touches
    # Node. Stale-while-revalidate keeps latency flat during refreshes.
    location ~ ^/(posts|federation/actors)/ {
        proxy_pass http://127.0.0.1:4040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache posts;
        proxy_cache_key "$scheme$host$uri$gstmxx_variant";
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        proxy_cache_lock on;            # collapse a thundering herd into one miss
        add_header X-Cache-Status $upstream_cache_status;
    }

    # --- Everything else the backend owns: never cached ---------------------
    location ~ ^/(api|feed|admin|quote-authorizations|\.well-known|federation)(/|$) {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # --- Static client -------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
