# nginx site config for ghostmaxxing.vecna.eu
#
# Layout of the unified deployment:
#   * static client  -> served directly from the client-interface root
#   * approved media -> aliased from storage/ (cached, never hits Node)
#   * backend routes -> proxied to the Node process on 127.0.0.1:4040
#   * hot GETs of /posts/ -> cached for a week (a published post never changes)
#   * hot GETs of /federation/actors/ -> cached for a minute (the profile does
#     change: avatar, header, bio)
#   * inboxes -> matched first, never cached
#
# Avatars and headers are served by Node under /api/actors/.../media/... and are
# content-addressed, so they need no location of their own and are safe for the
# browser to cache forever.
#
# NOTE: `proxy_cache_path` and `map` are http{} directives. Put the two blocks
# below in the main http context (nginx.conf or a conf.d/ snippet), not inside
# this server{}. They are shown here for reference.
#
#   proxy_cache_path /var/cache/nginx/gstmxx levels=1:2
#                    keys_zone=posts:16m max_size=2g inactive=30d;
#
#   # Collapse Accept down to two variants so the cache is not fragmented by
#   # every browser's long Accept header, while still separating the HTML
#   # preview from the ActivityPub representation of the same /posts/:id URL.
#   map $http_accept $gstmxx_variant {
#       default            html;
#       "~*activity\+json" activitypub;
#       "~*ld\+json"       activitypub;
#   }

server {
    listen 80;
    listen [::]:80;
    server_name ghostmaxxing.vecna.eu;

    # TLS via Certbot / Let's Encrypt.
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/ghostmaxxing.vecna.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghostmaxxing.vecna.eu/privkey.pem;

    # Keep in sync with the Express/multer upload limit (15 MB).
    client_max_body_size 15M;

    # The static client is copied here by `npm run install` in the client repo.
    root /var/www/ghostmaxxing/client-interface;
    index index.html;

    # --- Approved media: served from disk, cached, never proxied ------------
    location /videos/ {
        alias /var/www/ghostmaxxing/backend/storage/approved/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
    location /clipboard/ {
        alias /var/www/ghostmaxxing/backend/storage/approved/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
    location /thumbnails/ {
        alias /var/www/ghostmaxxing/backend/storage/thumbnails/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- Inboxes: never cached, never delayed --------------------------------
    # This block MUST come before the cacheable one below. `/federation/actors/
    # <handle>/inbox` would otherwise fall into the 7-day cache location; POST
    # is not cached by nginx, but the inbox would inherit that block's shorter
    # timeouts and lose keep-alive, and a stray GET would be cached.
    location ~ ^/federation/actors/[^/]+/inbox$ {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # --- Hot, cacheable backend GETs ----------------------------------------
    # Posts are immutable once published, so they keep the long TTL.
    location ~ ^/posts/ {
        proxy_pass http://127.0.0.1:4040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache posts;
        proxy_cache_key "$scheme$host$uri$gstmxx_variant";
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        proxy_cache_lock on;            # collapse a thundering herd into one miss
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Actor documents are NOT immutable: the avatar, header, display name and
    # biography change whenever the operator runs `npm run profile`. A 7-day TTL
    # here means a remote server that discovers the actor today keeps drawing
    # last week's profile. One minute is still enough to absorb a crowd, while
    # stale-while-revalidate keeps the latency flat.
    location ~ ^/federation/actors/ {
        proxy_pass http://127.0.0.1:4040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache posts;
        proxy_cache_key "$scheme$host$uri$gstmxx_variant";
        proxy_cache_valid 200 1m;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # --- Everything else the backend owns: never cached ---------------------
    # `healthz` is in this list so a deploy check can read federation readiness
    # over TLS. Drop it from the group if you would rather keep it internal and
    # check it on 127.0.0.1:4040 instead.
    location ~ ^/(api|feed|admin|quote-authorizations|healthz|\.well-known|federation)(/|$) {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # --- Static client -------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}

